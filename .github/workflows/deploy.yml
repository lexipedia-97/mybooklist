name: Deploy MyBookList para App Store Connect

on:
  push:
    branches: [ "main" ]

jobs:
  build_and_upload:
    runs-on: macos-latest

    steps:
      - name: Baixar o código fonte do repositório
        uses: actions/checkout@v4

      - name: Selecionar o Xcode 26.0.1 (Suporte Oficial iOS 26)
        run: sudo xcode-select -switch /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Inicializar e Baixar SDK do iOS 26
        run: |
          # 1. Acorda o motor de simulação (evita o Erro 70)
          xcrun simctl list devices || true

          # 2. Aceita as licenças silenciosas da Apple
          sudo xcodebuild -runFirstLaunch || true

          # 3. Faz o download do pacote da plataforma iOS 26
          xcodebuild -downloadPlatform iOS

      - name: Forçar compatibilidade do projeto (Bypass Xcode Beta)
        run: |
          sed -i '' 's/objectVersion = 110;/objectVersion = 60;/g' MyBookList.xcodeproj/project.pbxproj

      - name: Instalar Certificados e Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Compilar o Archive (xcodebuild)
        run: |
          security cms -D -i $RUNNER_TEMP/build_pp.mobileprovision > $RUNNER_TEMP/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" $RUNNER_TEMP/profile.plist)

          xcodebuild archive \
            -project MyBookList.xcodeproj \
            -scheme MyBookList \
            -archivePath $RUNNER_TEMP/MyBookList.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Criar ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Exportar o IPA (.ipa)
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/MyBookList.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload para o App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_STORE_CONNECT_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/*.ipa \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APP_PASSWORD"
